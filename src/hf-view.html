<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Clean PC</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; background: #0b0b0b; color: #eee; font: 13px/1.35 Segoe UI, sans-serif; }
    #bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: #1c1c1c; border-bottom: 1px solid #333; flex: 0 0 auto; flex-wrap: wrap; }
    #bar button, #bar label { background: #2a2a2a; color: #eee; border: 1px solid #444; padding: 4px 8px; cursor: pointer; }
    #bar button.on { background: #3d5a3d; border-color: #5a7a5a; }
    #hint { opacity: 0.75; }
    #status { opacity: 0.8; }
    #screens { display: flex; gap: 4px; }
    #stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: stretch; justify-content: stretch; overflow: hidden; background: #050505; }
    #shot { width: 100%; height: 100%; object-fit: contain; cursor: crosshair; user-select: none; outline: none; }
    #shot.armed { outline: 2px solid #5a7a5a; outline-offset: -2px; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="live">Live</button>
    <button id="once">Скрин</button>
    <span id="screens">
      <button type="button" data-display="0" class="on">Экран 1</button>
      <button type="button" data-display="1">Экран 2</button>
    </span>
    <label><input type="checkbox" id="keys" checked /> клавиатура</label>
    <span id="hint">клик по картинке, затем печать</span>
    <span id="status">...</span>
  </div>
  <div id="stage">
    <img id="shot" alt="desktop" tabindex="0" />
  </div>
  <script>
    const shot = document.getElementById("shot");
    const status = document.getElementById("status");
    const screensEl = document.getElementById("screens");
    const keysEl = document.getElementById("keys");
    const stage = document.getElementById("stage");
    let geom = { left: 0, top: 0, width: 1, height: 1 };
    let live = true;
    let busy = false;
    let inputBusy = 0;
    let urlObj = null;
    let display = 0;
    let screenCount = 2;
    let moveTimer = 0;
    let lastMove = null;

    function ask(type, body, timeout) {
      inputBusy += 1;
      return fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Timeout": String(timeout || 4000) },
        body: JSON.stringify({ id: Math.random().toString(16).slice(2, 10), type, body: body || {} }),
      }).then((res) => res.json()).catch((e) => ({ ok: false, error: String(e.message || e) })).finally(() => {
        inputBusy = Math.max(0, inputBusy - 1);
      });
    }

    function mapEvent(ev) {
      const r = shot.getBoundingClientRect();
      const nw = Math.max(1, shot.naturalWidth || r.width);
      const nh = Math.max(1, shot.naturalHeight || r.height);
      const scale = Math.min(r.width / nw, r.height / nh);
      const dw = nw * scale;
      const dh = nh * scale;
      const ox = r.left + (r.width - dw) / 2;
      const oy = r.top + (r.height - dh) / 2;
      const px = (ev.clientX - ox) / Math.max(1e-6, dw);
      const py = (ev.clientY - oy) / Math.max(1e-6, dh);
      const cx = Math.min(1, Math.max(0, px));
      const cy = Math.min(1, Math.max(0, py));
      return {
        x: geom.left + cx * geom.width,
        y: geom.top + cy * geom.height,
      };
    }

    function markScreens() {
      [...screensEl.querySelectorAll("button")].forEach((btn) => {
        const i = Number(btn.getAttribute("data-display"));
        btn.className = i === display ? "on" : "";
        btn.hidden = screenCount > 0 && i >= screenCount;
      });
    }

    function pickScreen(i) {
      display = i;
      markScreens();
    }

    screensEl.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-display]");
      if (!btn) return;
      pickScreen(Number(btn.getAttribute("data-display")));
    });

    function renderScreens(header) {
      const parts = String(header || "").split(",").filter(Boolean);
      if (!parts.length) {
        markScreens();
        return;
      }
      screenCount = parts.length;
      const prev = [...screensEl.querySelectorAll("button")].map((b) => Number(b.getAttribute("data-display")));
      if (prev.length !== parts.length) {
        screensEl.innerHTML = "";
        parts.forEach((part, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.setAttribute("data-display", String(i));
          btn.textContent = "Экран " + (i + 1);
          screensEl.appendChild(btn);
        });
      }
      markScreens();
    }

    async function refresh() {
      if (busy) return;
      busy = true;
      const want = display;
      const t0 = performance.now();
      try {
        const maxw = Math.min(1920, Math.max(640, Math.round(stage.clientWidth || 960)));
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Timeout": "20000" },
          body: JSON.stringify({
            id: Math.random().toString(16).slice(2, 10),
            type: "screenshot",
            body: { fmt: "jpeg", display: want, maxw, quality: 22 },
          }),
        });
        if (res.status === 503) {
          status.textContent = "rtc down";
          return;
        }
        const j = await res.json();
        const body = j.body && typeof j.body === "object" ? j.body : j;
        if (!body.blob_b64) {
          status.textContent = body.error || ("shot " + res.status);
          return;
        }
        geom.left = Number(body.left) || 0;
        geom.top = Number(body.top) || 0;
        geom.width = Number(body.width) || 1;
        geom.height = Number(body.height) || 1;
        const header = Array.isArray(body.screens)
          ? body.screens.map((s, i) => (Number.isInteger(s?.i) ? s.i : i) + ":" + (s.width || 0) + "x" + (s.height || 0) + (s.primary ? "p" : "")).join(",")
          : "";
        renderScreens(header);
        if (display !== want) return;
        const bin = atob(body.blob_b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const blob = new Blob([bytes], { type: body.mime || "image/jpeg" });
        if (urlObj) URL.revokeObjectURL(urlObj);
        urlObj = URL.createObjectURL(blob);
        shot.src = urlObj;
        const ms = Math.round(performance.now() - t0);
        status.textContent = (ms > 1000 ? "медленно " : "") + ms + " ms " + (body.bytes || bytes.length) + " b";
      } catch (e) {
        status.textContent = String(e.message || e);
      } finally {
        busy = false;
      }
    }

    document.getElementById("once").onclick = () => refresh();
    document.getElementById("live").textContent = "Live on";
    document.getElementById("live").onclick = () => {
      live = !live;
      document.getElementById("live").textContent = live ? "Live on" : "Live";
      if (live) tick();
    };

    async function tick() {
      if (!live) return;
      if (!inputBusy) await refresh();
      else await new Promise((r) => setTimeout(r, 40));
      if (live) setTimeout(tick, 0);
    }

    function armKeyboard() {
      shot.focus();
      shot.classList.add("armed");
    }

    shot.addEventListener("mousedown", (ev) => {
      ev.preventDefault();
      armKeyboard();
      const p = mapEvent(ev);
      const op = ev.button === 2 ? "rightclick" : ev.button === 1 ? "middleclick" : ev.detail > 1 ? "dblclick" : "click";
      ask("mouse", { op, x: p.x, y: p.y }, 4000);
    });
    shot.addEventListener("mousemove", (ev) => {
      lastMove = mapEvent(ev);
      if (moveTimer) return;
      moveTimer = setTimeout(() => {
        moveTimer = 0;
        const p = lastMove;
        if (!p) return;
        ask("mouse", { op: "move", x: p.x, y: p.y }, 2500);
      }, 40);
    });
    shot.addEventListener("contextmenu", (ev) => ev.preventDefault());
    shot.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const p = mapEvent(ev);
      ask("mouse", { op: "scroll", x: p.x, y: p.y, dy: ev.deltaY > 0 ? -120 : 120, dx: ev.deltaX ? (ev.deltaX > 0 ? 120 : -120) : 0 }, 2500);
    }, { passive: false });
    shot.addEventListener("blur", () => shot.classList.remove("armed"));
    shot.addEventListener("focus", () => shot.classList.add("armed"));

    window.addEventListener("keydown", (ev) => {
      if (ev.target && ev.target.tagName === "INPUT") return;
      if (!keysEl.checked) return;
      if (document.activeElement !== shot) return;
      ev.preventDefault();
      const keys = [];
      if (ev.ctrlKey) keys.push("ctrl");
      if (ev.altKey) keys.push("alt");
      if (ev.shiftKey && ev.key.length > 1) keys.push("shift");
      const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Escape: "esc", Enter: "enter", Tab: "tab", Backspace: "backspace", Delete: "delete", Home: "home", End: "end", PageUp: "pageup", PageDown: "pagedown", " ": "space" };
      if (map[ev.key]) keys.push(map[ev.key]);
      else if (ev.key.length === 1 && (ev.ctrlKey || ev.altKey)) keys.push(ev.key);
      else if (ev.key.length === 1) {
        ask("type", { text: ev.key }, 4000);
        return;
      } else if (/^F\d+$/i.test(ev.key)) keys.push(ev.key.toLowerCase());
      if (keys.length) ask("key", { keys }, 4000);
    });

    markScreens();
    tick();
  </script>
</body>
</html>
